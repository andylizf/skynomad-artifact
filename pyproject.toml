[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# `benchmark_components` lives under scripts_multi/ but is imported unqualified by
# the sweep driver and the configs, so it is installed as a top-level package.
# Without that, every documented command would need a PYTHONPATH prefix.
where = [".", "scripts_multi"]
include = ["sky_spot*", "benchmark_components*"]

[project]
name = "cant-be-late"
version = "0.1.0"
description = "SkyPilot Spot Simulator - Cloud computing simulation framework for spot instance strategies"
authors = [{name = "SkyPilot Team"}]
# 3.10 is a hard floor, not a preference: the simulator and several figure
# scripts use PEP 604 unions (`float | None`) in annotations that are evaluated
# at runtime, which is a TypeError on 3.9. Declaring anything lower makes
# `uv sync` pick a system 3.9 and fail later in a confusing place.
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "matplotlib>=3.3.0",
    "pyyaml>=5.4.0",
    "tqdm>=4.62.0",
    "scipy>=1.7.0",
    "plotly>=5.0.0",
    "configargparse>=1.5.0",
    "filelock>=3.0.0",
    "ray>=2.0.0",
    "pulp>=2.0",
    "wandb>=0.21.1",
    "colorama>=0.4.6",
    "matplotlib",
    "numpy",
    "seaborn",
    "skypilot[gcp]>=0.10.1",
    "google-cloud-storage>=3.3.0",
    "holoviews>=1.17.1",
    "bokeh>=3.1.1",
    "boto3>=1.37.38",
    "flask",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.pytest.ini_options]
markers = [
    "slow: runs a sweep rather than a unit of logic; skip with -m 'not slow'",
]
